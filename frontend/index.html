<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Stream: governed changes to Google Ads and Meta campaigns for car dealerships. Every change is reviewed, approved and recorded."
    />
    <!-- Opt in to the operating system text size (Dynamic Type): all type and spacing tokens are in rem, so the layout scales. -->
    <meta name="text-scale" content="scale" />
    <title>Stream</title>
    <script>
      // Apply the saved/OS theme before first paint so dark mode never flashes light (keep in sync with useTheme.ts).
      try {
        var saved = localStorage.getItem('stream.theme')
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('app-dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
